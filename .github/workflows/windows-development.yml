name: Windows development contract

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-development.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "electron-builder.win*.yml"
      - "package-lock.json"
      - "package.json"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    # The product Google OAuth client is built into the package; it comes from repository secrets and never from
    # the repository itself. Without them the build stops before packaging (see google-product-configuration.ts).
    env:
      SES_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.SES_GOOGLE_OAUTH_CLIENT_ID }}
      SES_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.SES_GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run fetch:embedding-model
      - run: npm run verify:embedding-model
      - run: npm run fetch:reranker-model
      - run: npm run verify:reranker-model
      - run: npm run fetch:ner-model
      - run: npm run verify:ner-model
      - run: npm run test:privacy-quality-gate
      - run: npm run test:google-workspace-contract
      - run: npm run test:platform:win
      - run: npm run test:windows-ocr
      - run: npm run test:windows-local-workers
      - run: npm test
      - run: npm run pack:win:dir
      - run: npm run test:package:win
      - run: npm run pack:win:unsigned
      - run: npm run test:installer:win -- --development
      # The unsigned NSIS installer that passed the install test, for internal distribution.
      - uses: actions/upload-artifact@v4
        with:
          name: SES-Agent-Desktop-windows-x64
          path: release/windows-dev/*.exe
          if-no-files-found: error
          retention-days: 14
